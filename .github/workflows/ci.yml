name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly check for habluetooth / bleak changes that break the pin.
    - cron: "17 9 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  test:
    name: tests (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # stable: the versions the latest Home Assistant release pins
        # dev:    the versions Home Assistant's dev branch pins (next release)
        # latest: the newest releases on PyPI
        target: [stable, dev, latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Resolve library versions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          packages="habluetooth bleak bleak-retry-connector dbus-fast"
          if [ "$TARGET" = latest ]; then
            echo "spec=$packages" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$TARGET" = stable ]; then
            ref=$(gh api repos/home-assistant/core/releases/latest --jq .tag_name)
          else
            ref=dev
          fi
          constraints=$(gh api -H "Accept: application/vnd.github.raw" \
            "repos/home-assistant/core/contents/homeassistant/package_constraints.txt?ref=$ref")
          spec=""
          for p in $packages; do
            line=$(printf '%s\n' "$constraints" | grep -iE "^${p}==" || true)
            if [ -z "$line" ]; then
              echo "::error::$p is not pinned in Home Assistant $ref"
              exit 1
            fi
            spec="$spec $line"
          done
          echo "Home Assistant $ref pins:$spec"
          echo "spec=$spec" >> "$GITHUB_OUTPUT"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . ${{ steps.versions.outputs.spec }} pytest pytest-asyncio
          python -m pip list | grep -iE "habluetooth|bleak|dbus-fast"

      - name: Test
        run: python -m pytest -v

      - name: Open an issue when the scheduled check fails
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Compatibility check failed: $TARGET"
          body="The weekly check against **$TARGET** library versions failed: $RUN_URL

          A failing \`test_the_private_hooks_still_exist\` means habluetooth renamed or removed a method the pinned client overrides; until fixed, \`pinned_client_class()\` returns None and integrations fall back to Home Assistant's own routing (with the post-connect path check)."
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing: $RUN_URL"
          else
            gh issue create --title "$title" --body "$body"
          fi
